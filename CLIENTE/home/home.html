<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barbearia Lobo - Agenda</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="home.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@3.0.0-beta.0/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@3.0.0-beta.0/index.min.js"></script>
    <script>
        MobileDragDrop.polyfill({
            dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });
        window.addEventListener('touchmove', function() {}, {passive: false});
    </script>
</head>
<body class="selection:bg-amber-500/30 overflow-hidden relative">

    <div id="bg-watermark" class="fixed inset-0 z-[-1] flex items-center justify-center pointer-events-none opacity-[0.04] overflow-hidden">
        <img id="watermark-img" src="../img/lobologo.jpeg" alt="" class="w-[80%] md:w-[50%] max-w-2xl transition-all duration-700">
    </div>

    <header class="fixed top-0 left-0 right-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex-shrink-0 flex items-center">
                <img id="header-logo" src="../img/lobologo.jpeg" alt="Barbearia Lobo" class="h-10 w-auto cursor-pointer">
            </div>

            <button id="btn-mobile-menu" class="md:hidden p-2 text-zinc-400 hover:text-white">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>

            <nav id="main-nav" class="hidden md:flex absolute md:relative top-16 md:top-0 left-0 w-full md:w-auto flex-col md:flex-row items-stretch md:items-center gap-1 bg-zinc-950 md:bg-zinc-900/50 p-4 md:p-1 border-b border-zinc-800 md:border md:border-zinc-800/50 shadow-xl md:shadow-none z-50">
                <a href="../home/home.html" class="px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-100 bg-zinc-800 rounded-md shadow-sm transition-all border border-zinc-700/50">Agenda</a>
                <a href="../clientes/clientes.html" class="px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Clientes</a>
                <a href="../servicos/servicos.html" class="px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Serviços</a>
                <a href="../financeiro/financeiro.html" class="px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Financeiro</a>
                <a href="../config/config.html" class="px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Config</a>
            </nav>

            <div class="hidden md:flex items-center gap-2">
                <div class="flex items-center gap-2 bg-zinc-900 py-1.5 px-2 rounded-full border border-zinc-800">
                   <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Admin" class="w-6 h-6 rounded-full" />
                   <span class="text-xs font-medium text-zinc-400 pr-2">Admin</span>
                </div>
            </div>
        </div>
    </header>

    <div class="pt-20 md:pt-24 pb-4 px-2 md:px-4 max-w-7xl mx-auto space-y-4 h-screen flex flex-col">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 flex-shrink-0">
            <div class="flex items-center justify-between md:justify-start gap-3 w-full md:w-auto bg-zinc-900/50 p-1.5 rounded-xl border border-zinc-800/50">
                <button id="btn-prev-days" class="p-2.5 hover:bg-zinc-800 rounded-lg text-zinc-400 hover:text-white transition-colors">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center justify-center gap-2 px-2 cursor-pointer flex-1 md:flex-none" id="btn-current-month">
                    <i data-lucide="calendar" class="w-4 h-4 text-amber-500"></i>
                    <span id="current-month-display" class="font-semibold text-sm whitespace-nowrap">Mês 202X</span>
                </div>
                <button id="btn-next-days" class="p-2.5 hover:bg-zinc-800 rounded-lg text-zinc-400 hover:text-white transition-colors">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
                <button id="btn-today" class="text-xs font-medium bg-amber-500/10 text-amber-500 hover:bg-amber-500/20 px-3 py-2 rounded-lg ml-1">Hoje</button>
            </div>

            <div class="flex flex-row items-center gap-2 w-full md:w-auto">
                <div class="flex items-center bg-zinc-900 rounded-lg border border-zinc-800 px-3 py-2.5 flex-1 min-w-0">
                    <i data-lucide="filter" class="w-4 h-4 text-zinc-500 mr-2 flex-shrink-0"></i>
                    <select id="barber-filter" class="bg-transparent border-none text-sm text-zinc-300 focus:outline-none w-full appearance-none cursor-pointer truncate">
                        <option value="all">Todos os Barbeiros</option>
                    </select>
                </div>
                <button id="btn-new-appt" class="bg-zinc-100 hover:bg-white text-black px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-md flex-shrink-0">
                    <i data-lucide="plus" class="w-5 h-5 md:w-4 md:h-4"></i> <span class="hidden sm:inline">Agendar</span>
                </button>
            </div>
        </div>

        <main class="bg-zinc-900/30 border border-zinc-800 rounded-xl md:rounded-2xl overflow-hidden flex flex-col flex-1 min-h-0 mb-4 shadow-xl">
            <div class="flex border-b border-zinc-800 bg-zinc-900/80 flex-shrink-0 overflow-x-auto no-scrollbar" id="grid-header">
                <div class="w-16 flex-shrink-0 border-r border-zinc-800/50 bg-zinc-900/50 sticky left-0 z-20"></div> 
            </div>
            <div class="flex-1 overflow-auto custom-scrollbar relative" id="grid-body"></div>
        </main>
    </div>

    <div id="appointment-modal" class="fixed inset-0 z-50 flex md:items-center justify-center bg-zinc-950 md:bg-black/80 md:backdrop-blur-sm hidden animate-fadeIn md:p-4">
        <div class="bg-zinc-900 md:border border-zinc-800 rounded-none md:rounded-2xl w-full h-full md:h-auto max-w-md shadow-2xl flex flex-col animate-slideUp">
            <div class="px-6 py-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900 z-10 flex-shrink-0">
                <h2 id="modal-title" class="text-xl font-bold text-amber-500">Novo Agendamento</h2>
                <button id="btn-close-modal" class="text-zinc-500 hover:text-white p-1"><i data-lucide="x-circle" class="w-7 h-7"></i></button>
            </div>
            <form id="appointment-form" class="p-6 space-y-4 flex-1 overflow-y-auto custom-scrollbar">
                <input type="hidden" id="form-id">
                <input type="hidden" id="form-status" value="pending">
                
                <div class="mb-4">
                    <div class="flex justify-between items-end mb-1">
                        <label class="block text-xs font-medium text-zinc-500 uppercase">Cliente</label>
                        <button type="button" id="btn-toggle-client" class="text-xs text-amber-500 hover:text-amber-400 font-bold flex items-center gap-1 transition-colors py-1">
                            <i data-lucide="user-plus" class="w-3 h-3"></i> <span id="text-toggle-client">Novo Cliente</span>
                        </button>
                    </div>
                    
                    <div id="client-select-container">
                        <select id="form-client" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-3.5 text-zinc-100 outline-none"></select>
                    </div>
                    
                    <div id="new-client-container" class="hidden flex flex-col gap-3 bg-zinc-950/50 p-3 rounded-lg border border-zinc-800/50">
                        <input type="text" id="new-client-name" placeholder="Nome Completo" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-3 text-zinc-100 outline-none text-sm focus:border-amber-500 transition-colors">
                        <input type="tel" id="new-client-phone" placeholder="WhatsApp / Telefone" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-3 text-zinc-100 outline-none text-sm focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-500 uppercase mb-1">Serviço</label>
                        <select id="form-service" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-3.5 text-zinc-100 outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-500 uppercase mb-1">Barbeiro</label>
                        <select id="form-barber" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-3.5 text-zinc-100 outline-none"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-500 uppercase mb-1">Data</label>
                        <input type="date" id="form-date" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-3.5 text-zinc-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-500 uppercase mb-1">Hora</label>
                        <select id="form-time" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-3.5 text-zinc-100 outline-none"></select>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-xs font-medium text-zinc-500 uppercase mb-1">Observações do Cliente</label>
                    <textarea id="form-notes" rows="2" placeholder="Nenhuma observação..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-3 text-zinc-400 outline-none resize-none text-sm focus:border-amber-500 transition-colors"></textarea>
                </div>

                <div id="modal-actions" class="pt-4 border-t border-zinc-800 hidden">
                    <div class="flex gap-2">
                        <button type="button" onclick="app.updateStatus('confirmed')" class="flex-1 py-3 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:bg-zinc-700" id="btn-status-confirm">Confirmar</button>
                        <button type="button" onclick="app.updateStatus('completed')" class="flex-1 py-3 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:bg-zinc-700 font-bold !text-emerald-500" id="btn-status-complete">Finalizar e Pagar</button>
                    </div>
                </div>
                <div class="pb-24 md:pb-0"></div>
            </form>
            <div class="p-4 border-t border-zinc-800 bg-zinc-900 flex justify-between items-center flex-shrink-0 pb-safe md:pb-4 absolute md:relative bottom-0 w-full">
                <button type="button" id="btn-delete" class="text-red-500 hover:text-red-400 text-sm font-medium hidden px-4 py-3">Excluir</button>
                <button type="submit" form="appointment-form" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-3.5 rounded-xl font-bold ml-auto w-full md:w-auto shadow-lg">Salvar Agendamento</button>
            </div>
        </div>
    </div>

    <div id="payment-modal" class="fixed inset-0 z-50 flex md:items-center justify-center bg-zinc-950 md:bg-black/80 md:backdrop-blur-sm hidden animate-fadeIn md:p-4">
        <div class="bg-zinc-900 md:border border-zinc-800 rounded-none md:rounded-2xl w-full h-full md:h-auto max-w-md shadow-2xl flex flex-col animate-slideUp">
            <div class="px-6 py-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/50 flex-shrink-0">
                <h2 class="text-xl font-bold text-emerald-500 flex items-center gap-2">
                    <i data-lucide="wallet" class="w-5 h-5"></i> Pagamento
                </h2>
                <button id="btn-close-payment" class="text-zinc-500 hover:text-white transition-colors p-1"><i data-lucide="x-circle" class="w-7 h-7"></i></button>
            </div>
            
            <form id="payment-form" class="p-6 space-y-5 flex-1 overflow-y-auto">
                <input type="hidden" id="payment-booking-id">
                
                <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex justify-between items-center shadow-inner">
                    <span class="text-zinc-400 font-medium text-sm uppercase tracking-wider">Total a Pagar</span>
                    <span id="payment-total" class="text-3xl font-bold text-zinc-100">€ 0,00</span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-500 uppercase mb-3">Método de Pagamento</label>
                    <div class="grid grid-cols-2 gap-3" id="payment-methods-container">
                        <label class="flex items-center p-3 border border-zinc-800 rounded-xl cursor-pointer hover:bg-zinc-800 transition-all bg-zinc-900/50 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                            <input type="radio" name="payment_method" value="mbway" class="hidden" required>
                            <span class="font-medium text-sm flex items-center gap-2 text-zinc-300"><i data-lucide="smartphone" class="w-4 h-4 text-sky-400"></i> MB WAY</span>
                        </label>
                        <label class="flex items-center p-3 border border-zinc-800 rounded-xl cursor-pointer hover:bg-zinc-800 transition-all bg-zinc-900/50 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                            <input type="radio" name="payment_method" value="multibanco" class="hidden">
                            <span class="font-medium text-sm flex items-center gap-2 text-zinc-300"><i data-lucide="credit-card" class="w-4 h-4 text-blue-500"></i> Multibanco</span>
                        </label>
                        <label class="flex items-center p-3 border border-zinc-800 rounded-xl cursor-pointer hover:bg-zinc-800 transition-all bg-zinc-900/50 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                            <input type="radio" name="payment_method" value="cartao" class="hidden">
                            <span class="font-medium text-sm flex items-center gap-2 text-zinc-300"><i data-lucide="credit-card" class="w-4 h-4 text-zinc-400"></i> Cartão (TPA)</span>
                        </label>
                        <label class="flex items-center p-3 border border-zinc-800 rounded-xl cursor-pointer hover:bg-zinc-800 transition-all bg-zinc-900/50 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                            <input type="radio" name="payment_method" value="dinheiro" class="hidden">
                            <span class="font-medium text-sm flex items-center gap-2 text-zinc-300"><i data-lucide="banknote" class="w-4 h-4 text-emerald-500"></i> Dinheiro</span>
                        </label>
                    </div>
                </div>

                <div id="cash-details" class="hidden space-y-4 pt-4 border-t border-zinc-800/80 animate-fadeIn">
                    <div>
                        <label class="block text-xs font-medium text-zinc-500 uppercase mb-2">Valor Entregue (€)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 font-bold">€</span>
                            <input type="number" id="payment-received" step="0.01" min="0" placeholder="0.00" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-9 pr-4 py-3.5 text-zinc-100 outline-none focus:border-emerald-500 transition-colors text-lg font-medium">
                        </div>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-zinc-950/80 rounded-xl border border-zinc-800">
                        <span class="text-xs font-bold text-zinc-500 uppercase">Troco a devolver</span>
                        <span id="payment-change" class="text-xl font-bold text-zinc-400">€ 0,00</span>
                    </div>
                </div>
                <div class="pb-24 md:pb-0"></div>
            </form>

            <div class="p-4 border-t border-zinc-800 bg-zinc-900 flex-shrink-0 absolute md:relative bottom-0 w-full pb-safe">
                <button type="submit" form="payment-form" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-4 md:py-3.5 rounded-xl font-bold transition-colors flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/20">
                    <i data-lucide="check-circle" class="w-5 h-5"></i> Confirmar Recebimento
                </button>
            </div>
        </div>
    </div>

    <button id="fab-new" class="fixed bottom-6 right-6 md:hidden w-14 h-14 bg-amber-500 text-black rounded-full flex items-center justify-center z-50 shadow-lg"><i data-lucide="plus"></i></button>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="sua-configuracao-global-firebase.js"></script> <script src="../navbar/nav.js"></script>
    <script type="module" src="home-auth.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <script type="module" src="home.js"></script>
    
</body>
</html>
