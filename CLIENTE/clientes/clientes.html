<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Lobo - Clientes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="clientes.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body class="selection:bg-amber-500/30 overflow-hidden h-screen flex flex-col relative">

    <div id="bg-watermark" class="fixed inset-0 z-[-1] flex items-center justify-center pointer-events-none opacity-[0.04] overflow-hidden">
        <img id="watermark-img" src="../img/lobologo.jpeg" alt="" class="w-[80%] md:w-[50%] max-w-2xl transition-all duration-700">
    </div>

<header class="fixed top-0 left-0 right-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800 flex-shrink-0">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
        
        <div class="flex-shrink-0 flex items-center">
            <img id="header-logo" src="../img/lobologo.jpeg" alt="Barbearia Lobo" class="h-10 w-auto cursor-pointer">
        </div>

        <button id="btn-mobile-menu" class="md:hidden p-2 text-zinc-400 hover:text-white">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <nav id="main-nav" class="hidden md:flex absolute md:relative top-16 md:top-0 left-0 w-full md:w-auto flex-col md:flex-row items-stretch md:items-center gap-1 bg-zinc-950 md:bg-zinc-900/50 p-4 md:p-1 border-b border-zinc-800 md:border md:border-zinc-800/50 shadow-xl md:shadow-none z-50 rounded-none md:rounded-lg">
            <a href="../home/home.html" class="nav-link px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Agenda</a>
            <a href="../clientes/clientes.html" class="nav-link px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Clientes</a>
            <a href="../servicos/servicos.html" class="nav-link px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Serviços</a>
            <a href="../financeiro/financeiro.html" class="nav-link px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Financeiro</a>
            <a href="../config/config.html" class="nav-link px-4 py-3 md:py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-all">Config</a>
        </nav>

        <div class="hidden md:flex items-center gap-2 bg-zinc-900 py-1.5 px-2 rounded-full border border-zinc-800">
           <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Admin" class="w-6 h-6 rounded-full" />
           <span class="text-xs font-medium text-zinc-400 pr-2">Admin</span>
        </div>
    </div>
</header>

    <div class="flex-1 pt-20 pb-4 px-4 max-w-7xl mx-auto w-full flex flex-col gap-6 overflow-hidden">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 flex-shrink-0 animate-fadeIn">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Carteira de Clientes</h1>
                <p class="text-zinc-400 text-sm mt-1 flex items-center gap-2">
                    <span class="bg-amber-500/10 text-amber-500 px-1.5 py-0.5 rounded text-xs font-bold border border-amber-500/20" id="total-clients-badge">0</span> 
                    clientes cadastrados no sistema.
                </p>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-zinc-500"></i>
                    <input type="text" id="search-input" placeholder="Buscar por nome, email ou telefone..." 
                        class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 placeholder-zinc-600 transition-colors">
                </div>
                
                <button onclick="app.openNewClientModal()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg transition-all active:scale-95 whitespace-nowrap">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> <span class="hidden sm:inline">Novo Cliente</span>
                </button>
            </div>
        </div>

        <div class="flex-1 bg-zinc-900/50 border border-zinc-800 rounded-2xl overflow-hidden flex flex-col relative animate-fadeIn">
            <div class="grid grid-cols-12 gap-4 px-6 py-3 bg-zinc-900/80 border-b border-zinc-800 text-xs font-bold text-zinc-500 uppercase tracking-wider sticky top-0 backdrop-blur-sm z-10">
                <div class="col-span-4 sm:col-span-3">Nome / Cliente</div>
                <div class="col-span-5 sm:col-span-3">Contato</div>
                <div class="col-span-3 sm:col-span-2 hidden sm:block">Desde</div>
                <div class="col-span-3 hidden sm:block">Último Serviço</div>
                <div class="col-span-3 sm:col-span-1 text-right">Ações</div>
            </div>

            <div id="clients-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1"></div>

            <div class="px-6 py-3 border-t border-zinc-800 bg-zinc-900/50 text-xs text-zinc-500 flex justify-between items-center shrink-0">
                <span id="showing-text">Mostrando 0 de 0</span>
                <div class="flex gap-1">
                    <button class="px-2 py-1 rounded hover:bg-zinc-800 disabled:opacity-50"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>
                    <button class="px-2 py-1 rounded bg-zinc-800 text-white">1</button>
                    <button class="px-2 py-1 rounded hover:bg-zinc-800 disabled:opacity-50"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="client-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden animate-fadeIn">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-4xl shadow-2xl overflow-hidden animate-slideUp flex flex-col md:flex-row max-h-[90vh]">
            <div class="w-full md:w-1/3 bg-zinc-950/50 border-b md:border-b-0 md:border-r border-zinc-800 p-6 flex flex-col items-center text-center overflow-y-auto custom-scrollbar">
                <div class="w-24 h-24 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center text-zinc-400 font-bold text-3xl mb-4 relative">
                    <span id="detail-initials">--</span>
                    <div class="absolute bottom-0 right-0 w-6 h-6 bg-emerald-500 border-2 border-zinc-900 rounded-full"></div>
                </div>
                <h2 id="detail-name" class="text-xl font-bold text-white mb-1">...</h2>
                <div id="detail-status" class="mb-1 text-[10px] uppercase font-bold px-2 py-0.5 rounded"></div>
                <p id="detail-since" class="text-xs text-zinc-500 mb-6">...</p>
                
                <div class="w-full space-y-4 text-left">
                    <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                        <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">Telefone</label>
                        <div class="flex items-center gap-2 text-zinc-200 text-sm">
                            <i data-lucide="phone" class="w-4 h-4 text-amber-500"></i>
                            <span id="detail-phone">...</span>
                        </div>
                    </div>
                    <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                        <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">Email</label>
                        <div class="flex items-center gap-2 text-zinc-200 text-sm break-all">
                            <i data-lucide="mail" class="w-4 h-4 text-amber-500"></i>
                            <span id="detail-email">...</span>
                        </div>
                    </div>
                </div>

                <div class="w-full flex flex-col gap-2 mt-6 pt-6 border-t border-zinc-800">
                    <button onclick="app.openEditClientModal()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="edit-2" class="w-4 h-4"></i> Editar Dados
                    </button>
                    <button onclick="app.toggleBlockClient()" id="btn-block-client" class="w-full bg-amber-900/20 text-amber-500 hover:bg-amber-900/40 py-2.5 rounded-xl text-sm font-bold transition-colors border border-amber-900/50 flex items-center justify-center gap-2">
                        <i data-lucide="ban" class="w-4 h-4"></i> Bloquear Cliente
                    </button>
                    <button onclick="app.deleteClient()" class="w-full bg-red-900/20 text-red-500 hover:bg-red-900/40 py-2.5 rounded-xl text-sm font-bold transition-colors border border-red-900/50 flex items-center justify-center gap-2">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Excluir Cliente
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-0 bg-zinc-900">
                <div class="px-6 py-4 border-b border-zinc-800 flex justify-between items-center">
                    <h3 class="font-bold text-zinc-100">Visão Geral</h3>
                    <button onclick="app.closeModal()" class="text-zinc-500 hover:text-white transition-colors">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto custom-scrollbar space-y-6">
                    <div id="next-appt-card" class="hidden">
                        <label class="block text-xs font-bold text-zinc-500 uppercase mb-2 flex items-center gap-2">
                            <i data-lucide="calendar-clock" class="w-4 h-4 text-amber-500"></i> Próximo Agendamento
                        </label>
                        <div class="bg-gradient-to-r from-amber-500/10 to-amber-600/5 border border-amber-500/30 rounded-xl p-4 flex justify-between items-center">
                            <div>
                                <p id="next-appt-date" class="text-amber-500 font-bold text-lg">...</p>
                                <p id="next-appt-service" class="text-zinc-200 text-sm">...</p>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-500 uppercase mb-3 flex items-center gap-2">
                            <i data-lucide="history" class="w-4 h-4"></i> Histórico de Serviços
                        </label>
                        <div class="space-y-2" id="history-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="new-client-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden animate-fadeIn">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-slideUp">
            <div class="px-6 py-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/50">
                <h3 class="font-bold text-zinc-100 flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-5 h-5 text-amber-500"></i> Cadastrar Novo Cliente
                </h3>
                <button onclick="app.closeNewClientModal()" class="text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <form id="new-client-form" class="p-6 space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-zinc-500 uppercase">Nome Completo</label>
                    <input type="text" id="new-name" required placeholder="Ex: João Silva" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 transition-colors">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-zinc-500 uppercase">Telefone</label>
                    <input type="text" id="new-phone" placeholder="(85) 9 0000-0000" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 transition-colors">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-zinc-500 uppercase">E-mail</label>
                    <input type="email" id="new-email" placeholder="cliente@email.com" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 transition-colors">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="check" class="w-5 h-5"></i> Salvar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="edit-client-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden animate-fadeIn">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-slideUp">
            <div class="px-6 py-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/50">
                <h3 class="font-bold text-zinc-100 flex items-center gap-2">
                    <i data-lucide="edit-2" class="w-5 h-5 text-amber-500"></i> Editar Cliente
                </h3>
                <button onclick="app.closeEditClientModal()" class="text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <form id="edit-client-form" class="p-6 space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-zinc-500 uppercase">Nome Completo</label>
                    <input type="text" id="edit-name" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 transition-colors">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-zinc-500 uppercase">Telefone</label>
                    <input type="text" id="edit-phone" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 transition-colors">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-zinc-500 uppercase">E-mail</label>
                    <input type="email" id="edit-email" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-600 transition-colors">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-zinc-100 hover:bg-white text-zinc-900 py-3 rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            serverTimestamp,
            query,
            where,
            doc,
            updateDoc,
            deleteDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmljKXhjb9GlY1ABEA-GPJqNsftsv_hVk",
            authDomain: "ksstech-79520.firebaseapp.com",
            projectId: "ksstech-79520",
            storageBucket: "ksstech-79520.firebasestorage.app",
            messagingSenderId: "935997511388",
            appId: "1:935997511388:web:9c336727d3e588ee30c619",
            measurementId: "G-TM49C8N0T1"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);

        window.db = db;
        window.dbMethods = { collection, getDocs, addDoc, serverTimestamp, query, where, doc, updateDoc, deleteDoc, onSnapshot };
    </script>
    <script src="../navbar/nav.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
    <script src="clientes.js"></script>
</body>
</html>
