<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Gestão de Barbearia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>BARBEARIA</h1>
                <p>Acesso Restrito</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="geral@exemplo.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>

                <div class="form-actions">
                    <a href="#" id="forgot-password" class="link-text">Recuperar palavra-passe</a>
                </div>

                <button type="submit" class="btn-primary" id="btn-login">ACESSAR PAINEL</button>
            </form>

            <button id="btn-install" class="btn-install" style="display: none;">
                📲 INSTALAR APLICATIVO
            </button>

            <div class="footer-links">
                <a href="./CLIENTE/pagebarber/login.html" class="link-text text-muted">ACESSO EXCLUSIVO PARA BARBEIROS &rarr;</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // 1. Registo do Service Worker original
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }

        // 2. NOVA LÓGICA DO BOTÃO PWA
        let deferredPrompt;
        const btnInstall = document.getElementById('btn-install');

        // Escuta o evento do navegador que diz que o PWA pode ser instalado
        window.addEventListener('beforeinstallprompt', (e) => {
            // Previne o mini-infobar padrão do navegador de aparecer imediatamente
            e.preventDefault();
            
            // Guarda o evento para que possamos acioná-lo no clique do botão
            deferredPrompt = e;
            
            // Mostra o nosso botão personalizado
            btnInstall.style.display = 'flex';
        });

        // Quando o utilizador clica no nosso botão
        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt !== null) {
                // Mostra a janela nativa de instalação do navegador
                deferredPrompt.prompt();
                
                // Aguarda o utilizador escolher (Instalar ou Cancelar)
                const { outcome } = await deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    console.log('Utilizador aceitou instalar o PWA');
                } else {
                    console.log('Utilizador recusou instalar o PWA');
                }
                
                // Limpa o evento pois só pode ser usado uma vez
                deferredPrompt = null;
                
                // Oculta o botão novamente
                btnInstall.style.display = 'none';
            }
        });

        // Se o utilizador instalar o app (mesmo que por outro meio), escondemos o botão
        window.addEventListener('appinstalled', () => {
            btnInstall.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA instalado com sucesso!');
        });
    </script>
    <script type="module" src="auth.js"></script>
</body>
</html>
